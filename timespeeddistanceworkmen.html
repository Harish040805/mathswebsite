<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time, Speed, Distance, Work & Men Solver</title>
    <link rel="stylesheet" href="timespeeddistanceworkmencss.css">
</head>
<body>
<div class="container">
<h1>Time, Speed, Distance, Work & Men Solver</h1>
    <div class="main-layout">
        <div class="column" style="margin-bottom: 40px;">
            <h2>Shared Parameter</h2>
            <div class="gauge-box" style="margin-top: 20px;">
                <div class="input-group">
                    <table style="width: 100%; border-collapse: collapse; border: none;">
                        <tr style="border: none;">
                            <td style="border: none; padding: 0; text-align: left; vertical-align: middle; width: 40%;"><label for="time" style="margin-bottom: 0;">Time (t)</label></td>
                            <td style="border: none; padding: 0; width: 60%;"><input type="number" id="time" step="any" placeholder="Enter Time" oninput="calculateAll('time')"></td>
                        </tr>
                    </table>
                </div>
                <span class="gauge-label">Live Time Output</span>
                <div class="clock-visual">
                    <div id="clockHand" class="clock-hand"></div>
                    <div class="clock-number" style="top: 2px; left: 50px;">12</div>
                    <div class="clock-number" style="top: 12px; right: 23px;">1</div>
                    <div class="clock-number" style="top: 33px; right: 5px;">2</div>
                    <div class="clock-number" style="top: 50px; right: 2px;">3</div>
                    <div class="clock-number" style="top: 68px; right: 7px;">4</div>
                    <div class="clock-number" style="top: 88px; right: 23px;">5</div>
                    <div class="clock-number" style="bottom: 2px; left: 50px;">6</div>
                    <div class="clock-number" style="top: 88px; left: 23px;">7</div>
                    <div class="clock-number" style="top: 68px; left: 7px;">8</div>
                    <div class="clock-number" style="top: 50px; left: 2px;">9</div>
                    <div class="clock-number" style="top: 33px; left: 5px;">10</div>
                    <div class="clock-number" style="top: 12px; left: 23px;">11</div>
                </div>
                <div id="clockVal" class="gauge-value">-</div>
            </div>
        </div>
        <div class="columns-container">
        <div class="column">
            <h2>Time, Speed & Distance</h2>
            <div class="input-group">
                <table style="width: 100%; border-collapse: collapse; border: none;">
                    <tr style="border: none;">
                        <td style="border: none; padding: 0; text-align: left; vertical-align: middle; width: 40%;"><label for="distance" style="margin-bottom: 0;">Distance (d)</label></td>
                        <td style="border: none; padding: 0; width: 60%;"><input type="number" id="distance" step="any" placeholder="Enter Distance" oninput="calculateAll('distance')"></td>
                    </tr>
                </table>
            </div>
            <div class="input-group">
                <table style="width: 100%; border-collapse: collapse; border: none;">
                    <tr style="border: none;">
                        <td style="border: none; padding: 0; text-align: left; vertical-align: middle; width: 40%;"><label for="speed" style="margin-bottom: 0;">Speed (s)</label></td>
                        <td style="border: none; padding: 0; width: 60%;"><input type="number" id="speed" step="any" placeholder="Enter Speed" oninput="calculateAll('speed')"></td>
                    </tr>
                </table>
            </div>
            <div class="visual-container">
                <div class="gauge-box">
                    <span class="gauge-label">Live Speedometer</span>
                    <div class="speed-visual">
                        <div id="speedNeedle" class="speed-needle"></div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-135deg) translateY(-55px) rotate(135deg);">0</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-114deg) translateY(-55px) rotate(114deg);">20</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-93deg) translateY(-55px) rotate(93deg);">40</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-73deg) translateY(-55px) rotate(73deg);">60</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-52deg) translateY(-55px) rotate(52deg);">80</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-31deg) translateY(-55px) rotate(31deg);">100</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg) translateY(-55px) rotate(10deg);">120</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(10deg) translateY(-55px) rotate(-10deg);">140</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(31deg) translateY(-55px) rotate(-31deg);">160</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(52deg) translateY(-55px) rotate(-52deg);">180</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(73deg) translateY(-55px) rotate(-73deg);">200</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(93deg) translateY(-55px) rotate(-93deg);">220</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(114deg) translateY(-55px) rotate(-114deg);">240</div>
                        <div class="speed-number" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(135deg) translateY(-55px) rotate(-135deg);">260</div>
                        <div id="speedVal" class="gauge-value">-</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="column">
            <h2>Time, Work & Men</h2>
            <div class="input-group">
                <table style="width: 100%; border-collapse: collapse; border: none;">
                    <tr style="border: none;">
                        <td style="border: none; padding: 0; text-align: left; vertical-align: middle; width: 40%;"><label for="work" style="margin-bottom: 0;">Work (w)</label></td>
                        <td style="border: none; padding: 0; width: 60%;"><input type="number" id="work" step="any" placeholder="Enter Work" oninput="calculateAll('work')"></td>
                    </tr>
                </table>
            </div>
            <div class="input-group">
                <table style="width: 100%; border-collapse: collapse; border: none;">
                    <tr style="border: none;">
                        <td style="border: none; padding: 0; text-align: left; vertical-align: middle; width: 40%;"><label for="men" style="margin-bottom: 0;">Men (m)</label></td>
                        <td style="border: none; padding: 0; width: 60%;"><input type="number" id="men" step="any" placeholder="Enter Men" oninput="calculateAll('men')"></td>
                    </tr>
                </table>
            </div>
        </div>
            <button class="clear-btn" onclick="clearFields()">Reset All Fields</button>
        </div>
    </div>
</div>
<script src="timespeeddistanceworkmenjs.js"></script>
</body>
</html>
