<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evil Number Checker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #0a0a0a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.c { background: #141414; border: 2px solid #ff4500; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; text-align: center; }
h1 { color: #ff3300; margin-bottom: 15px; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 51, 0, 0.6); }
p { color: #aaaaaa; margin-bottom: 25px; font-size: 14px; line-height: 1.5; }
.f { margin-bottom: 20px; }
input { width: 100%; padding: 12px; border: 2px solid #ff6600; border-radius: 6px; background-color: #000000; color: #ffffff; font-size: 16px; outline: none; text-align: center; margin-bottom: 15px; }
input:focus { border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.7); }
button { flex: 1; padding: 12px; background: linear-gradient(45deg, #ff0000, #ff6600); border: none; border-radius: 6px; color: #ffffff; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: background 0.3s; }
button:hover { background: linear-gradient(45deg, #ff6600, #ff0000); }
.r { margin-top: 20px; padding: 15px; border-radius: 6px; background: #000000; border: 1px solid #2a2a2a; display: none; }
.r.v { display: block; }
.t { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
.y { color: #ff3300; text-shadow: 0 0 8px rgba(255, 51, 0, 0.6); }
.n { color: #ff8800; text-shadow: 0 0 8px rgba(255, 136, 0, 0.6); }
.d { font-size: 14px; color: #cccccc; margin-top: 6px; }
</style>
</head>
<body>
<div class="c">
<h1>👹 Evil Number Checker 😈</h1>
<p>⭐ An Evil number is a non-negative integer that has <br> an even number of 1's in its binary equivalent</p>
<div class="f">
<input type="number" id="in" placeholder="Enter positive integer N" min="0">
<div style="display: flex; gap: 10px;">
<button id="bt" onclick="chk()">▶️ Check Number</button>
<button id="cl" onclick="clr()">🗑️ Clear</button>
</div>
</div>
<div id="res" class="r">
<div id="out" class="t"></div>
<div id="bin" class="d"></div>
<div id="cnt" class="d"></div>
</div>
</div>
<script>
function chk() {
let e = document.getElementById("in");
let o = document.getElementById("out");
let b = document.getElementById("bin");
let c = document.getElementById("cnt");
let r = document.getElementById("res");
let v = e.value;
if (v === "" || v < 0) {
o.innerText = "Invalid Input";
o.className = "t n";
b.innerText = "";
c.innerText = "";
r.className = "r v";
return;
}
let n = parseInt(v, 10);
let s = n.toString(2);
let k = 0;
for (let i = 0; i < s.length; i++) {
if (s[i] === '1') {
k++;
}
}
if (k % 2 === 0) {
o.innerText = "Yes";
o.className = "t y";
} else {
o.innerText = "No";
o.className = "t n";
}
b.innerText = "Binary: " + s;
c.innerText = "Count of 1's: " + k;
r.className = "r v";
}
function clr() {
document.getElementById("in").value = "";
document.getElementById("res").className = "r";
}
</script>
</body>
</html>
